stages:
  - build
  - release

variables:
  # Match this Debian host's Go proxy; override in CI/CD variables if needed.
  GOPROXY: https://goproxy.cn,direct

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v/'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_MESSAGE !~ /^update README\n?$/'
    - when: never

.build-binary:
  stage: build
  image: golang:1.25-alpine
  variables:
    CGO_ENABLED: "0"
  script:
    - |
      mkdir -p build
      ext=""
      if [ "$GOOS" = "windows" ]; then
        ext=".exe"
      fi
      go build -o "build/lrcAPI-${GOOS}-${GOARCH}${ext}" .
  artifacts:
    name: "lrcAPI-binaries-${GOOS}-${GOARCH}"
    paths:
      - build/
    expire_in: 90 days

build:binary:
  extends: .build-binary
  tags:
    - self-hosted
  parallel:
    matrix:
      - GOOS: [linux, windows, darwin]
        GOARCH: [amd64, arm64]

release:
  stage: release
  image: python:3.13-alpine
  tags:
    - self-hosted
  needs:
    - job: build:binary
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  script:
    - python ci/create_release.py
