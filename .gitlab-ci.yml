stages:
  - build
  - release

variables:
  # Match this Debian host's Go proxy; override in CI/CD variables if needed.
  GOPROXY: https://goproxy.cn,direct

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v/'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_MESSAGE !~ /^update README\n?$/'
    - when: never

.build-binary:
  stage: build
  rules:
    - if: '$DOCKER_ONLY == "true" && $CI_COMMIT_BRANCH == "main"'
      when: never
    - when: on_success
  image: golang:1.25-alpine
  variables:
    CGO_ENABLED: "0"
  script:
    - |
      mkdir -p build
      ext=""
      if [ "$GOOS" = "windows" ]; then
        ext=".exe"
      fi
      go build -o "build/lrcAPI-${GOOS}-${GOARCH}${ext}" .
  artifacts:
    name: "lrcAPI-binaries-${GOOS}-${GOARCH}"
    paths:
      - build/
    expire_in: 90 days

build:binary:
  extends: .build-binary
  tags:
    - self-hosted
  parallel:
    matrix:
      - GOOS: [linux, windows, darwin]
        GOARCH: [amd64, arm64]

docker:
  stage: build
  retry:
    max: 2
    when:
      - runner_system_failure
      - script_failure
  image: docker:29-cli
  tags:
    - self-hosted
  environment:
    name: DOCKERHUB
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  parallel:
    matrix:
      - ARCH: amd64
        DOCKER_REPOSITORY: lrcapi-go
      - ARCH: arm64
        DOCKER_REPOSITORY: lrcapi-go-arm
  script:
    - |
      : "${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in GitLab CI/CD variables}"
      : "${DOCKERHUB_TOKEN:?Set DOCKERHUB_TOKEN in GitLab CI/CD variables}"
      export DOCKER_CONFIG="$(mktemp -d)"
      trap 'rm -rf "$DOCKER_CONFIG"' EXIT
      printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      image="${DOCKERHUB_USERNAME}/${DOCKER_REPOSITORY}"
      set -- --tag "${image}:latest"
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        set -- "$@" --tag "${image}:${CI_COMMIT_TAG}"
      fi
      docker buildx build \
        --platform "linux/${ARCH}" \
        --file "Dockerfile.d/${ARCH}" \
        --build-arg "GOPROXY=${GOPROXY}" \
        "$@" --push .

release:
  stage: release
  image: python:3.13-alpine
  tags:
    - self-hosted
  needs:
    - job: build:binary
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  script:
    - python ci/create_release.py
